name: .NET

on:
  push:
    branches: [main, release, 2.x.x]
  pull_request:
    branches: [main, release, 2.x.x]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Build rpc as library
      run: go build -buildmode=c-shared -o librpc.so ./cmd/rpc   
    - name: Restore dependencies
      run: cd samples/dotnet && dotnet restore
    - name: Build
      run: cd samples/dotnet && dotnet build --no-restore

