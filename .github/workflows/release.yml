# This workflow will release new versions when required using semantic-release

name: Semantic-Release CI

on:
  push:
    branches: [ main, release, 2.x.x ]

permissions:
  contents: read

# Every branch's release pushes the shared refs/notes/semantic-release ref, so runs must not overlap.
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # for Git to git push
      id-token: write # for Cosign keyless signing (Fulcio/OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Login
        if: ${{ github.ref == 'refs/heads/release' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: vprodemo.azurecr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true
      - name: Docker Login DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.INTC_DOCKER_USERNAME }}
          password: ${{ secrets.INTC_DOCKER_PASSWORD }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version: 'stable'
          check-latest: true
          # This job publishes release artifacts; do not restore a cache that a
          # pull request run could have poisoned.
          cache: false
      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses@v1.0.0
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.0.2'

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
            # It is recommended to specify specifying version range
            # for semantic-release.
          extra_plugins: |
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.ROSIE_TOKEN }}
