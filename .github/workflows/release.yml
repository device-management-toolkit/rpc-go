# This workflow will release new versions when required using semantic-release

name: Semantic-Release CI

on:
  push:
    branches: [main, 2.x, 2.0.x, 2.x.x]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # for Git to git push
      id-token: write # for Cosign keyless signing (Fulcio/OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c439dc8bdf85cadbbce9ed30d1c7b959517bc49 # v2.12.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Docker Login
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: vprodemo.azurecr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true
      - name: Docker Login DockerHub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.INTC_DOCKER_USERNAME }}
          password: ${{ secrets.INTC_DOCKER_PASSWORD }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.3.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses@v1.0.0
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: 'v3.0.2'

      # Authenticode signing of the Windows executables via Azure Trusted
      # Signing. Skipped automatically (sign-windows.sh no-ops) when the
      # AZURE_TS_* secrets are absent, e.g. on forks.
      - name: Install sign tool (Authenticode)
        if: ${{ vars.AZURE_TS_ENDPOINT != '' }}
        run: |
          dotnet tool install --global sign --version 0.9.1-beta.24469.1
          echo "PATH=$PATH:$HOME/.dotnet/tools" >> "$GITHUB_ENV"

      - name: Azure login for Trusted Signing
        if: ${{ vars.AZURE_TS_ENDPOINT != '' }}
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@c4a2fa890676fc2db25ad0aacd8ab4a0f1f4c024 # v4.2.1
        with:
          semantic_version:
            19.0.5 # It is recommended to specify specifying version range
            # for semantic-release.
          extra_plugins: |
            @semantic-release/exec@6.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.ROSIE_TOKEN }}
          AZURE_TS_ENDPOINT: ${{ vars.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ vars.AZURE_TS_ACCOUNT }}
          AZURE_TS_CERT_PROFILE: ${{ vars.AZURE_TS_CERT_PROFILE }}
