name: "CodeQL"

on:
  workflow_dispatch:  
  release:
    types:
      - created
  push:
    branches: [main, release, 2.x.x]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main, release, 2.x.x]
  schedule:
    - cron: '39 3 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}

    - run: |
        make build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
    - name: Generate Security Report
      uses: rsdmike/github-security-report-action@a3d8cc051bc89f1b622d396adab901aa73857a29 # v4.1.0
      continue-on-error: true
      with:
        template: report
        token: ${{ secrets.SECURITY_TOKEN }}
    - name: Rename Report
      shell: bash
      continue-on-error: true
      run: |
        DATE=$(date +"%Y-%m-%d")
        mv "report.pdf" "rpc-go-security-report-$DATE.pdf"
    - name: GitHub Upload Release Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: report
        path: ./*.pdf